name: Health monitor

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-monitor
  cancel-in-progress: false

jobs:
  check-health:
    if: github.event_name == 'workflow_dispatch' || vars.HEALTH_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check production health
        env:
          FEISHU_MONITOR_WEBHOOK: ${{ secrets.FEISHU_MONITOR_WEBHOOK }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://aurora-tonight.mengyu699.workers.dev/api/health' }}
        run: node scripts/health-monitor.mjs
