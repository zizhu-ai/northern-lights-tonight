name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # sitemap lastmod tests need full history for `git log --format=%cI`
          # on CONTENT_SOURCES. The default depth-1 clone reports HEAD's date
          # for every tracked file and fails `lib/sitemap.test.ts`.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Node unit tests
        run: npm run test:unit

      - name: Health monitor tests
        run: node --test scripts/health-monitor.test.mjs

      - name: IndexNow submit tests
        run: npm run test:indexnow

      - name: Python engine golden tests
        run: npm run test:engine

      - name: TypeScript/Python parity tests
        run: npm run test:parity

      - name: Cloudflare Worker build
        run: npm run cf-build

      - name: Lint
        run: npm run lint

      - name: Worker size
        run: npm run test:worker-size
