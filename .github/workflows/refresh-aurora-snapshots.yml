name: Refresh aurora snapshots

# Phase 2: snapshots are computed live on Vercel (request-driven, ISR).
# This workflow is retired as a scheduler; keep workflow_dispatch only as a
# manual dry-run harness (runs the engine, does NOT push to main).
on:
  workflow_dispatch:

concurrency:
  group: refresh-aurora-snapshots
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh snapshots (dry-run, no push)
        run: |
          python3 engine/snapshot.py
          git status --porcelain snapshots/
