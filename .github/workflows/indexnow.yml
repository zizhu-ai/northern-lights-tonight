name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the IndexNow payload without POSTing
        type: boolean
        default: false

concurrency:
  group: indexnow
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for production and submit sitemap URLs
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/indexnow-submit.mjs --wait --dry-run
          else
            node scripts/indexnow-submit.mjs --wait
          fi
